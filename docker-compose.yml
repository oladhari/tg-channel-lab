services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    command: bash -lc "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      # IMPORTANT: frontend container must reach backend container
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped


  listener:
    build: ./backend
    env_file: .env
    command: bash -lc "mkdir -p /app/sessions && python -m app.workers.run_listener"
    depends_on:
      - db
    volumes:
      - ./sessions:/app/sessions
    restart: unless-stopped

  recorder:
    build: ./backend
    env_file: .env
    command: bash -lc "mkdir -p /app/sessions && python -m app.workers.run_recorder"
    depends_on:
      - db
    volumes:
      - ./sessions:/app/sessions
    restart: unless-stopped


volumes:
  pgdata:
