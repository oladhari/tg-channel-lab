services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build: ./backend
    env_file: .env
    command: bash -lc "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/channels')\" 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ✅ PROD frontend (stable)
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      BACKEND_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
      DISABLE_ESLINT_PLUGIN: "true"
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

  # 🛠 DEV frontend (only when you need hot reload)
  # Run with: docker compose --profile dev up -d frontend-dev
  frontend-dev:
    profiles: ["dev"]
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      BACKEND_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
      DISABLE_ESLINT_PLUGIN: "true"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      - api
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev", "--", "-p", "3000", "-H", "0.0.0.0"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

  listener:
    build: ./backend
    env_file: .env
    command: bash -lc "alembic upgrade head && mkdir -p /app/sessions && python -m app.workers.run_listener"
    depends_on:
      - db
      - api
    volumes:
      - ./sessions:/app/sessions
      - ./backend/alembic/versions:/app/alembic/versions
    restart: unless-stopped

  recorder:
    build: ./backend
    env_file: .env
    command: bash -lc "alembic upgrade head && mkdir -p /app/sessions && python -m app.workers.run_recorder"
    depends_on:
      - db
      - api
    volumes:
      - ./sessions:/app/sessions
      - ./backend/alembic/versions:/app/alembic/versions
    restart: unless-stopped

  trader:
    build: ./backend
    env_file: .env
    command: ["python", "-m", "app.workers.run_trader_gmgn"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./sessions:/app/sessions
    restart: unless-stopped

  trader-live:
    profiles: ["live"]   # disabled until SOLANA_PRIVATE_KEY is set
    build: ./backend
    env_file: .env
    command: ["python", "-m", "app.workers.run_trader_live"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  buyer:
    build: ./backend
    env_file: .env
    command: ["python", "-m", "app.workers.run_buyer_gmgn"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./sessions:/app/sessions
    restart: unless-stopped

  buyer-live:
    profiles: ["live"]   # disabled until SOLANA_PRIVATE_KEY is set
    build: ./backend
    env_file: .env
    command: ["python", "-m", "app.workers.run_buyer_live"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
